
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Gcodscript AI APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Check Flet installation
        run: uv run flet --version

      - name: Build APK
        run: |
          uv run flet build apk \
            --yes \
            --verbose \
            --output build/apk \
            --python-version 3.12 \
            --build-number ${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: gcodscript-ai-apk
          path: build/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
